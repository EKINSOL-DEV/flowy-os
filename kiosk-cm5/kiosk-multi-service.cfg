# Kiosk Multi-Service Configuration
# Flowy smart clock — Weston + Chromium kiosk + nginx + FastAPI

# Base configuration
[generic64-apt-simple]
hostname = flowpi
default_locale = en_US.UTF-8
timezone = Europe/Brussels
keymap = us

# System packages
packages = systemd-resolved,
    NetworkManager,
    openssh-server,
    sudo,
    curl,
    wget,
    htop,
    tzdata,
    # Web server and proxy
    nginx,
    # Wayland compositor
    weston,
    # Kiosk browser
    chromium-browser,
    # Python runtime
    python3,
    python3-pip,
    python3-venv,
    python3-dev,
    # NFC libraries
    libnfc6,
    libnfc-dev,
    pcscd,
    pcsc-tools,
    # Network tools
    network-manager,
    wireless-tools,
    wpasupplicant,
    # Audio (Spotify Connect via raspotify)
    raspotify,
    # Build tools for Python native deps
    build-essential,
    pkg-config,
    libssl-dev,
    libffi-dev

# User configuration
[user]
name = flowy
password = demo
groups = sudo,video,render,input,dialout
shell = /bin/bash

# Network configuration
[network]
enable_ssh = true
enable_networkmanager = true

# Boot configuration
[boot]
enable_uart = true
gpu_mem = 128

# Kiosk specific settings
[kiosk]
auto_login = false
start_kiosk = false
kiosk_url = http://localhost:8080

# Services to enable
[services]
enable = nginx,
    flowy-weston,
    flowy-unified-api
