# Kiosk Multi-Service Configuration
# Based on generic64-apt-simple.cfg with additional services

# Base configuration
[generic64-apt-simple]
hostname = kiosk-cm5
default_locale = en_US.UTF-8
timezone = UTC
keymap = us

# System packages
packages = systemd-resolved,
    NetworkManager,
    openssh-server,
    sudo,
    curl,
    wget,
    git,
    htop,
    vim,
    # Web server and proxy
    nginx,
    # Kiosk browser
    chromium-browser,
    x11-xserver-utils,
    xinit,
    # Python runtime
    python3,
    python3-pip,
    python3-venv,
    python3-dev,
    # NFC libraries
    libnfc6,
    libnfc-dev,
    pcscd,
    pcsc-tools,
    # Docker
    docker.io,
    docker-compose,
    # Network tools
    network-manager,
    wireless-tools,
    wpasupplicant,
    # Development tools
    build-essential,
    pkg-config,
    libssl-dev,
    libffi-dev

# User configuration
[user]
name = kiosk
password = kiosk123
groups = sudo,docker,dialout
shell = /bin/bash

# Network configuration
[network]
enable_ssh = true
enable_networkmanager = true

# Boot configuration
[boot]
enable_uart = true
gpu_mem = 128

# Kiosk specific settings
[kiosk]
auto_login = true
start_kiosk = true
kiosk_url = http://localhost/

# Services to enable
[services]
enable = nginx,
    docker,
    kiosk-frontend,
    kiosk-nfc,
    kiosk-network,
    kiosk-updater