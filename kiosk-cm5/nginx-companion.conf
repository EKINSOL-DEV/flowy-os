server {
    listen 80;
    server_name _;

    # Companion PWA (static files)
    root /opt/flowy/companion;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;  # SPA fallback
    }

    # API proxy to FastAPI on port 10000
    location /display/ {
        proxy_pass http://127.0.0.1:10000/display/;
    }
    location /wifi/ {
        proxy_pass http://127.0.0.1:10000/wifi/;
    }
    location /music/ {
        proxy_pass http://127.0.0.1:10000/music/;
    }
    location /photos/ {
        proxy_pass http://127.0.0.1:10000/photos/;
    }
    location /led/ {
        proxy_pass http://127.0.0.1:10000/led/;
    }
    location /nfc/ {
        proxy_pass http://127.0.0.1:10000/nfc/;
    }
    location /settings {
        proxy_pass http://127.0.0.1:10000/settings;
    }
    location /alarms {
        proxy_pass http://127.0.0.1:10000/alarms;
    }
    location /snapins/ {
        proxy_pass http://127.0.0.1:10000/snapins/;
    }

    # Photo static files
    location /photos-static/ {
        proxy_pass http://127.0.0.1:10000/photos-static/;
    }

    # SSE events
    location /events {
        proxy_pass http://127.0.0.1:10000/events;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
    }
}
