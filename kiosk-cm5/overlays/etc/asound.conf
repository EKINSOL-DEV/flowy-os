# Software volume control for HiFiBerry DAC (no hardware mixer)
# Uses card name instead of number for robustness across module reload.
pcm.softvol {
    type softvol
    slave.pcm "plughw:sndrpihifiberry,0"
    control {
        name "SoftMaster"
        card sndrpihifiberry
    }
    min_dB -40.0
    max_dB 0.0
}

pcm.!default {
    type plug
    slave.pcm "softvol"
}

ctl.!default {
    type hw
    card sndrpihifiberry
}
