# Software volume control for HiFiBerry DAC (no hardware mixer)
# The pcm5102a DAC has no volume control — output is always full scale.
# This softvol plugin provides software volume attenuation.
pcm.softvol {
    type softvol
    slave.pcm "plughw:2,0"
    control {
        name "SoftMaster"
        card 0
    }
    min_dB -40.0
    max_dB 0.0
}

pcm.!default {
    type plug
    slave.pcm "softvol"
}

ctl.!default {
    type hw
    card 0
}
