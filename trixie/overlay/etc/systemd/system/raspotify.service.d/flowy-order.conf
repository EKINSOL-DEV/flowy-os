# Drop-in at /etc/systemd/system/raspotify.service.d/flowy-order.conf
#
# 1. Ordering: a working DAC and the ALSA softvol "SoftMaster" control only
#    exist after flowy-audio-init has run (see that script for the two boot
#    races it repairs).
# 2. Self-healing: raspotify's stock unit ships Restart= COMMENTED OUT, so one
#    audio hiccup left librespot dead until someone noticed days later —
#    Spotify then still lists albums (Web API) but "Flowy" is gone as a
#    playback device. Restart on failure, and re-run the audio check first so
#    a half-registered card is repaired before each attempt.
[Unit]
After=flowy-audio-init.service
Wants=flowy-audio-init.service
StartLimitIntervalSec=300s
StartLimitBurst=10

[Service]
ExecStartPre=-/usr/local/bin/flowy-audio-init.sh
Restart=on-failure
RestartSec=20
