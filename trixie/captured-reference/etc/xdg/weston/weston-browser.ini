# /etc/xdg/weston/weston-browser.ini — weston config for BROWSER MODE.
# Same as weston.ini but with desktop-shell: kiosk-shell forces every window
# fullscreen, which chromium treats as F11-fullscreen and hides its tab/URL
# bar. Desktop-shell gives chromium a normal maximized window with its UI.
[core]
shell=desktop-shell.so
modules=systemd-notify.so
renderer=gl
repaint-window=7

[shell]
panel-position=none
background-color=0xff2d2a26
locking=false

# Visible cursor: browser mode is meant for mouse use.
[libinput]
enable-tap=true

[output]
name=DSI-2
transform=rotate-270

[autolaunch]
path=/usr/bin/flowy-kiosk
watch=true

[input-method]
path=/usr/lib/aarch64-linux-gnu/weston-keyboard
