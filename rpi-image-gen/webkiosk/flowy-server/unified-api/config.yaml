# Flowy Unified API Configuration
server:
  host: "0.0.0.0"
  port: 8000
  debug: false
  reload: false
  title: "Flowy Unified API"
  description: "Unified API system for Flowy OS with modular cogs architecture"
  version: "1.0.0"

# Logging configuration
logging:
  level: "INFO"
  log_dir: "/flowy/logs"
  max_file_size_mb: 10
  backup_count: 5
  console_logging: true

# CORS settings
cors:
  allow_origins: ["*"]
  allow_credentials: true
  allow_methods: ["*"] 
  allow_headers: ["*"]

# Cog-specific settings
cogs:
  led:
    enabled: true
    mock_mode: false  # Set to true for testing without hardware
    default_brightness: 1.0
    startup_color: "purple"  # Color to show on startup
    
  nfc:
    enabled: true
    mock_mode: false  # Set to true for testing without hardware
    use_pico_bridge: true  # Set to true to use Pi Pico USB bridge (recommended)
    usb_device: null  # USB device path for Pico bridge (auto-detect if null)
    hardware_pins:
      i2c_bus: "/dev/i2c-1"
      gpio_int: 23
      gpio_enable: 24
      gpio_fwdnld: 25
    polling:
      auto_start: false  # Start polling on cog initialization
      
  wifi:
    enabled: true
    mock_mode: false  # Set to true for testing without hardware
    default_interface: "wlan0"
    scan_timeout: 10
    connection_timeout: 30
    prefer_networkmanager: true  # Use NetworkManager as primary method
    
  system:
    enabled: true
    monitoring:
      update_interval: 5  # WebSocket update interval in seconds
      cache_duration: 2   # CPU usage cache duration in seconds
      max_processes: 10   # Maximum processes to return in process list
    allowed_services:  # Services that can be restarted via API
      - "flowy-unified-api"
      - "NetworkManager"
      - "ssh"

# WebSocket settings
websocket:
  ping_interval: 30  # Ping interval in seconds
  ping_timeout: 10   # Ping timeout in seconds
  close_timeout: 10  # Connection close timeout in seconds

# Health check settings
health:
  check_interval: 60  # Health check interval in seconds
  failure_threshold: 3  # Number of consecutive failures before marking as failed
  
# Security settings  
security:
  api_key_required: false  # Set to true to require API key authentication
  api_key_header: "X-API-Key"
  allowed_ips: []  # Empty list allows all IPs
  rate_limiting:
    enabled: false
    requests_per_minute: 100