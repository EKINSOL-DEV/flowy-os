[core]
# Use kiosk-shell for single-application kiosk mode (REQUIRED for true kiosk)
shell=kiosk-shell.so
# Load systemd-notify module for proper systemd integration (REQUIRED)
modules=systemd-notify.so
# Use OpenGL renderer for hardware acceleration, fallback to pixman if needed
renderer=gl
# Optimize repaint timing for embedded systems (default 7ms)
repaint-window=7

[shell]
# Hide panel for kiosk mode
panel-position=none
# Set desktop background
background-image=/usr/share/pixmaps/debian-logo.png
background-type=scale-crop
# Hide cursor for touch interface
cursor-theme=
cursor-size=1

[output]
# Configure primary DSI-2 display with 270-degree rotation
name=DSI-2
transform=rotate-270

[keyboard]
# Set keyboard layout to match system configuration
keymap_layout=gb
keymap_variant=
keymap_options=

[libinput]
# Configure touch input optimizations
enable-tap=true
tap-and-drag=true

[autolaunch]
# Launch flowy-app automatically when Weston starts and restart if it closes
path=/usr/bin/flowy-app
watch=true